<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Splash App</title>
    <!-- Required. Without this there is no window.splash and no native calls.
         Served by the app in a release build; by your dev server, from
         public/__splash.js, while developing. Regenerate that copy with
         `splash-oh shim` after upgrading. -->
    <script src="/__splash.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
