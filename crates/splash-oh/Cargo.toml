[package]
name = "splash-oh"
version = "0.1.0"
edition = "2021"
description = "Splash DSL rendered to OpenHarmony native ArkUI widgets, without ArkTS"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The Splash VM, via ymote/Splash rather than straight from makepad.
#
# splash-core is the standalone runtime: it re-exports the VM as `vm` and
# path-depends on its OWN vendored copy of it, pinned to a reviewed upstream
# commit, with widgets, platform scripting, filesystem, process, timer and
# network deliberately excluded from the import. Taking it from here rather than
# from a makepad branch means the VM this app runs is pinned and auditable
# instead of moving under it, and it comes with bounded execution limits and a
# syntax preflight that the bare VM does not have.
splash-core = { git = "https://github.com/ymote/Splash.git", branch = "main" }

napi-derive-ohos = "0.0.9"
napi-ohos = "0.1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"

[build-dependencies]
cc = "1.0"
