[package]
name = "splash-oh-arkui"
version = "0.1.0"
edition = "2021"
description = "Splash DSL rendered to OpenHarmony native ArkUI widgets, with no ArkTS in the loop"

# An rlib, not a cdylib. This crate has no napi surface of its own: the ArkTS
# side loads exactly one .so, and that is the webview crate, which depends on
# this one. Splitting the artifact would mean two copies of the ArkUI shim in
# one process.
[lib]
crate-type = ["rlib"]

[dependencies]
# The Splash VM, via ymote/Splash rather than straight from makepad.
splash-core = { git = "https://github.com/ymote/Splash.git", branch = "main" }
serde_json = "1.0.151"

[build-dependencies]
cc = "1.0"
