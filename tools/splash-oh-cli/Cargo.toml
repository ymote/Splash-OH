[package]
name = "splash-oh-cli"
version = "0.1.0"
edition = "2021"
description = "Host-side tooling for a Splash-OH app"

[[bin]]
name = "splash-oh"
path = "src/main.rs"

[dependencies]
splash-oh-core = { path = "../../crates/splash-oh-core" }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
