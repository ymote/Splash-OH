[workspace]
resolver = "2"
members = [
    "crates/splash-oh-native",
    "crates/splash-oh-core",
    "tools/splash-oh-cli",
    "crates/splash-oh-plugin-demo",
    "crates/splash-oh-webview",
    "examples/wechat",
    "examples/taobao",
    "examples/tiktok",
    "examples/wonderous",
    "examples/wonderous-makepad",
    "examples/material-catalog",
    "examples/flutter-catalog",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
